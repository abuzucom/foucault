name: scheduled-validation

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python3 -m pip install --requirement requirements-checkers.txt
      - name: Run policy and evaluator checks
        run: make audit-check PYTHON=python3
      - name: Run repository tests
        run: python3 scripts/run_tests.py
