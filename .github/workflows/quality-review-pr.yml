name: quality-review-pr

# Runs the abuzucom/euler quality review on this repository's pull requests
# beside the security review. The euler reusable workflow loads its policy and
# its own adapter from the pinned euler commit, so this repository supplies no
# adapter files.
#
# The workflow_run trigger keeps this caller on default-branch code. A pull
# request cannot edit the reviewer. The caller subscribes to the ci workflow
# and the Immutable Compliance workflow, and the review starts only when both
# runs succeeded for the same head revision. Either workflow can finish first,
# so the caller reads both results and starts the review on the later pass.
#
# Fork pull requests receive no provider secret until a maintainer applies the
# safe-to-review label. The fork job runs in the protected fork-review
# environment, and the environment supplies the provider key after approval.

on:
  workflow_run:
    workflows: [ci, "Immutable Compliance"]
    types: [completed]

concurrency:
  group: quality-review-${{ github.repository }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      found: ${{ steps.pr.outputs.found }}
      same_repository: ${{ steps.pr.outputs.same_repository }}
      number: ${{ steps.pr.outputs.number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      title: ${{ steps.pr.outputs.title }}
      body: ${{ steps.pr.outputs.body }}
      ci_passed: ${{ steps.pr.outputs.ci_passed }}
      compliance_passed: ${{ steps.pr.outputs.compliance_passed }}
      fork_review_approved: ${{ steps.pr.outputs.fork_review_approved }}
    steps:
      - name: Resolve pull request from the head revision
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed('workflow run head SHA is invalid');
              return;
            }

            const pulls = await github.paginate(
              github.rest.pulls.list,
              { ...context.repo, state: 'open', per_page: 100 },
            );
            const matches = pulls.filter((pull) => pull.head.sha === headSha);
            if (matches.length !== 1) {
              core.setOutput('found', 'false');
              return;
            }

            let pull = matches[0];
            const headRepository = pull.head?.repo;
            if (!headRepository?.full_name || !headRepository.clone_url) {
              core.setFailed('pull request head repository metadata is unavailable');
              return;
            }
            const baseRepository = `${context.repo.owner}/${context.repo.repo}`;
            const sameRepository =
              headRepository.full_name.toLowerCase() === baseRepository.toLowerCase();

            // The safe-to-review label can change after the workflow run
            // payload was written. Read the current pull request from the API
            // so a fork decision uses the label state at the moment of the run.
            if (!sameRepository) {
              const current = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
              });
              pull = current.data;
            }

            // The review starts only when the ci workflow and the Immutable
            // Compliance workflow both succeeded for this head revision.
            // The most recent run of each workflow decides the outcome, so a
            // failed re-run does not inherit an earlier success.
            const latestRun = async (workflowName, event) => {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: headSha,
                  event,
                  per_page: 100,
                },
              );
              const matches = runs.filter(
                (run) => run.name === workflowName && run.head_sha === headSha,
              );
              matches.sort((left, right) => right.id - left.id);
              return matches.length > 0 ? matches[0] : null;
            };

            const ciRun = await latestRun('ci', 'pull_request');
            const complianceRun = await latestRun(
              'Immutable Compliance', 'pull_request_target');
            const ciPassed = ciRun !== null && ciRun.conclusion === 'success';
            const compliancePassed =
              complianceRun !== null && complianceRun.conclusion === 'success';

            const forkReviewApproved = !sameRepository &&
              (pull.labels || []).some((label) =>
                label.name === 'safe-to-review'
              );

            core.setOutput('found', 'true');
            core.setOutput(
              'same_repository', sameRepository ? 'true' : 'false');
            core.setOutput('number', String(pull.number));
            core.setOutput('base_sha', pull.base.sha);
            core.setOutput('head_sha', pull.head.sha);
            core.setOutput('title', pull.title || '');
            core.setOutput('body', pull.body || '');
            core.setOutput('ci_passed', ciPassed ? 'true' : 'false');
            core.setOutput(
              'compliance_passed', compliancePassed ? 'true' : 'false');
            core.setOutput(
              'fork_review_approved', forkReviewApproved ? 'true' : 'false');

  review:
    needs: resolve
    if: >-
      needs.resolve.outputs.found == 'true' &&
      needs.resolve.outputs.same_repository == 'true' &&
      needs.resolve.outputs.ci_passed == 'true' &&
      needs.resolve.outputs.compliance_passed == 'true'
    # The euler reusable workflow downloads its review artifact, posts a pull
    # request comment, and publishes a check run. The job grants each
    # permission that the reusable workflow uses.
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    # Euler 0.6.6. Keep the uses: pin and quality_ref on the same commit.
    uses: abuzucom/euler/.github/workflows/quality-review.yml@368c3260cfd1b4154b8418de920c6d68f28e4db7
    with:
      pr_number: ${{ fromJSON(needs.resolve.outputs.number) }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      pr_title: ${{ needs.resolve.outputs.title }}
      pr_body: ${{ needs.resolve.outputs.body }}
      quality_ref: 368c3260cfd1b4154b8418de920c6d68f28e4db7
      fail_on_block: true
      # The evaluation corpus and the test suite hold intentional defects.
      exclude_paths: "eval/cases/** tests/**"
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  fork-review:
    needs: resolve
    if: >-
      needs.resolve.outputs.found == 'true' &&
      needs.resolve.outputs.same_repository == 'false' &&
      needs.resolve.outputs.fork_review_approved == 'true' &&
      needs.resolve.outputs.ci_passed == 'true' &&
      needs.resolve.outputs.compliance_passed == 'true'
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    uses: abuzucom/euler/.github/workflows/quality-review.yml@368c3260cfd1b4154b8418de920c6d68f28e4db7
    with:
      pr_number: ${{ fromJSON(needs.resolve.outputs.number) }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      pr_title: ${{ needs.resolve.outputs.title }}
      pr_body: ${{ needs.resolve.outputs.body }}
      quality_ref: 368c3260cfd1b4154b8418de920c6d68f28e4db7
      fail_on_block: true
      fork_review: true
      exclude_paths: "eval/cases/** tests/**"
    # The fork job reads the provider key from the protected fork-review
    # environment. The caller passes no repository secret to this call.

  fork-review-skipped:
    needs: resolve
    if: >-
      needs.resolve.outputs.found == 'true' &&
      needs.resolve.outputs.same_repository == 'false' &&
      needs.resolve.outputs.fork_review_approved != 'true' &&
      needs.resolve.outputs.ci_passed == 'true' &&
      needs.resolve.outputs.compliance_passed == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Publish skip result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        with:
          script: |
            await github.rest.checks.create({
              ...context.repo,
              name: 'quality-review',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion: 'skipped',
              output: {
                title: 'Skipped for fork pull request',
                summary: 'A maintainer must apply the safe-to-review label before the quality review runs.',
              },
            });
